<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<title>JEDEN overlay</title>
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
html,body{margin:0;padding:0;background:transparent !important;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#scene{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent}

/* ===== PASEK DOLNY (jeden_pasek_calosc.html) ===== */
#barwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:var(--mb,43px);transition:transform .6s var(--ease)}
#barwrap.off{transform:translateY(calc(100% + var(--mb,43px) + 30px))}
#root{position:relative;width:1662px;height:214px;display:grid;grid-template-columns:155px 1507px;grid-template-rows:157px 57px}
#logo{background:#0a1a2e url(/assets/jeden_logo.png) center/cover no-repeat}
#clock{background:#16305c;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#time{font-size:27px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.4);color:#fff;font-variant-numeric:tabular-nums}
#head{box-sizing:border-box;background:#d60f08;border-radius:0 18px 0 0;padding:14px 40px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45)}
#head::after{content:"";position:absolute;bottom:0;left:0;right:0;height:6px;background:#7a0000}
.line{color:#fff;font-size:42px;font-weight:800;text-transform:uppercase;letter-spacing:-.5px;line-height:1.25;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.35)}
#ticker{background:#fff;overflow:hidden;position:relative;display:flex;align-items:center}
#ticker::before,#ticker::after{content:"";position:absolute;left:0;right:0;height:2px;background:#dc2626;z-index:2}
#ticker::before{top:0}#ticker::after{bottom:0}
#track{display:flex;align-items:center;white-space:nowrap;width:max-content;will-change:transform}
.lap{display:flex;align-items:center;white-space:nowrap}
.news{color:#003366;font-size:29px;font-weight:bold;text-transform:uppercase;letter-spacing:-.5px}
.bullet{display:inline-block;width:10px;height:29px;background:#dc2626;margin:0 28px;transform:skewX(-25deg);flex-shrink:0}
@keyframes sc{to{transform:translateX(-50%)}}

/* ===== PLAKIETKA NA ŻYWO (live_badge_v2.html) ===== */
#livewrap{position:absolute;top:var(--lt,43px);right:var(--lr,53px);height:64px;transition:transform .6s var(--ease)}
#livewrap.off{transform:translateX(calc(100% + var(--lr,53px) + 30px))}
.livebadge{box-sizing:border-box;width:100%;height:100%;padding:0 30px;display:flex;align-items:center;justify-content:center;gap:12px;background:#d60f08;border-radius:8px;font-family:Arial,Helvetica,sans-serif;box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative;overflow:hidden}
.ldot{width:14px;height:14px;border-radius:50%;background-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);flex-shrink:0}
.ltxt{color:#fff;font-size:26px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.4)}

/* ===== QR (nad logiem JEDEN, lewa krawędź i szerokość równo z logiem) ===== */
#qrwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:calc(var(--mb,43px) + 214px + 14px);transition:transform .6s var(--ease)}
#qrwrap.off{transform:translateX(calc(-100% - 129px - 60px))}
#fqrbox{box-sizing:border-box;width:155px;background:#fff;padding:8px;box-shadow:0 6px 14px rgba(0,0,0,.45);display:none}
#fqr{display:block;width:100%;height:auto}

/* ===== ZBIÓRKA (nad paskiem, prawa krawędź równo z paskiem) ===== */
#fundwrap{position:absolute;right:calc(129px - var(--ox,0px));bottom:calc(var(--mb,43px) + 214px + 14px);display:flex;align-items:flex-end;transition:transform .6s var(--ease)}
#fundwrap.off{transform:translateX(calc(100% + 400px))}
#fcard{position:relative;width:520px;background:#050d1c;border-top:6px solid #dc2626;box-shadow:0 6px 14px rgba(0,0,0,.45);overflow:hidden;font-family:'Oswald','Arial Narrow',Impact,Arial,sans-serif}
#fbg{position:absolute;left:0;right:0;top:0;height:240px;background:#1a2438 center/cover no-repeat}
#fbg svg{position:absolute;inset:0;width:100%;height:100%}
#fbg.photo svg{display:none}
#fshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,28,.2) 0,rgba(5,13,28,.55) 130px,#050d1c 245px)}
#ftext{position:relative;padding:112px 20px 4px;text-align:center;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.55),0 3px 12px rgba(0,0,0,.85)}
#frow{display:flex;align-items:baseline;justify-content:center;gap:14px;white-space:nowrap}
#fl1{font-size:28px;font-weight:700;letter-spacing:.5px;color:#fff}
#fam{font-size:58px;font-weight:700;line-height:1.1;color:#4fc3ff}
#fl2{font-size:36px;font-weight:700;line-height:1.12;color:#fff;margin-top:2px;text-wrap:balance}
#fstrip{position:relative;padding:12px 20px 20px}
#ftrack{position:relative;height:44px;background:#07142a;border:2px solid #c9d1dc;border-radius:3px;overflow:hidden}
#ffill{height:100%;width:0;background:#2fb344;transition:width .8s var(--ease)}
#fpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ===== REKLAMY (pełny ekran, pliki public/ads/1.mp4, 2.mp4 …) ===== */
#adwrap{position:absolute;inset:0;background:#000;opacity:0;visibility:hidden;z-index:50;transition:opacity .5s,visibility 0s .5s}
#adwrap.on{opacity:1;visibility:visible;transition:opacity .5s}
#adv{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#adlabel{position:absolute;top:43px;left:53px;background:#d60f08;color:#fff;font:800 24px Arial,sans-serif;letter-spacing:1px;padding:8px 18px;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.45)}

/* ===== SONDAŻ (sondaz_tv.html) ===== */
#pstage{position:absolute;inset:0;pointer-events:none}
#wipe{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,#dc0432 40%,#ff3b3b 60%,transparent);transform:skewX(-20deg);opacity:0}
#pstage.on #wipe{animation:wipe 1.1s var(--ease) forwards}
@keyframes wipe{0%{left:-40%;opacity:.95}100%{left:120%;opacity:0}}
#pcard{position:absolute;left:50%;top:50%;width:1400px;transform:translate(-50%,-46%) scale(.94);opacity:0;clip-path:inset(0 100% 0 0 round 18px);
 background:linear-gradient(160deg,#0e1c33,#060f1e);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.8);
 transition:clip-path 1s var(--ease) .25s,transform 1s var(--ease) .25s,opacity .4s .25s}
#pstage.on #pcard{opacity:1;transform:translate(-50%,-50%) scale(1);clip-path:inset(0 0 0 0 round 18px)}
#pcard::before{content:"";position:absolute;inset:0;border-radius:18px;padding:3px;background:linear-gradient(120deg,#dc2626,#ff6b3d,#dc2626,#7a0000);background-size:300% 300%;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:bs 6s ease infinite;pointer-events:none}
@keyframes bs{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#phead{background:linear-gradient(90deg,#a10000,#e6130a 60%,#ff3b3b);padding:26px 48px 22px;position:relative;overflow:hidden}
#phead::after{content:"";position:absolute;top:0;bottom:0;width:160px;left:-200px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
#pstage.on #phead::after{animation:sweep 1.4s ease 1.2s}
@keyframes sweep{to{left:110%}}
#ptitle{font-size:46px;font-weight:900;letter-spacing:-.5px;text-shadow:0 3px 8px rgba(0,0,0,.4)}
#psub{font-size:20px;opacity:.85;margin-top:6px;font-weight:600}
#prows{padding:34px 48px 40px;display:flex;flex-direction:column;gap:var(--gap,18px)}
.row{display:flex;align-items:center;gap:22px;height:var(--rh,96px);opacity:0;transform:translateX(-80px);transition:transform .8s var(--ease) calc(.5s + var(--i)*.18s),opacity .5s calc(.5s + var(--i)*.18s),filter .6s,transform .6s}
#pstage.on .row{opacity:1;transform:none}
.logo{width:var(--rh,96px);height:var(--rh,96px);flex:none;border-radius:50%;background:#fff;border:5px solid var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo span{font-size:calc(var(--rh,96px)*.45);font-weight:900;color:var(--c)}
.name{width:260px;flex:none;font-size:34px;font-weight:800;line-height:1.05}
.track{flex:1;height:calc(var(--rh,96px)*.62);background:rgba(255,255,255,.08);border-radius:40px;overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.bar{height:100%;width:0;border-radius:40px;background:linear-gradient(90deg,var(--c2,#444),var(--c,#888));position:relative;overflow:hidden;
 transition:width 1.9s cubic-bezier(.22,1,.36,1)}
.bar::after{content:"";position:absolute;top:0;bottom:0;width:90px;left:-120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
.go .bar::after{animation:sweep 1.4s ease 1.6s}
.pct{width:190px;flex:none;text-align:right;font-size:58px;font-weight:900;font-variant-numeric:tabular-nums}
.pct small{font-size:30px;opacity:.8}
.pbadge{position:absolute;right:30px;top:18px;background:#ffd23a;color:#111;font-weight:900;font-size:18px;letter-spacing:1px;padding:7px 16px;border-radius:20px;opacity:0;transform:scale(.4) rotate(-8deg);transition:.5s cubic-bezier(.34,1.8,.5,1);z-index:3}
#pstage.win .pbadge{opacity:1;transform:scale(1) rotate(-4deg)}
#pstage.win .row:not(.lead){opacity:.55;filter:saturate(.6)}
#pstage.win .row.lead{transform:scale(1.025)}
#pstage.win .row.lead .bar{box-shadow:0 0 40px var(--c),0 0 90px var(--c);animation:pulse 1.2s ease-in-out infinite}
#pstage.win .row.lead .logo{animation:pop .7s cubic-bezier(.34,1.8,.5,1)}
@keyframes pulse{50%{filter:brightness(1.35)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#pstage.win #flash{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.45}100%{opacity:0}}
#pstage.off #pcard{opacity:0;transform:translate(-50%,-56%) scale(.96);clip-path:inset(0 0 0 100% round 18px);transition:all .7s ease-in}
</style>
</head>
<body>
<div id="scene">
  <div id="barwrap" class="off">
    <div id="root">
      <div id="logo"></div>
      <div id="head"><div class="line" id="l1"></div><div class="line" id="l2"></div></div>
      <div id="clock"><div id="time">00:00</div></div>
      <div id="ticker"><div id="track"></div></div>
    </div>
  </div>

  <div id="qrwrap" class="off">
    <div id="fqrbox"><img id="fqr" alt=""></div>
  </div>

  <div id="fundwrap" class="off">
    <div id="fcard">
      <div id="fbg"><svg viewBox="0 0 520 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <clipPath id="fcl"><path d="M0 6C30-8 60 20 90 6S150-6 180 8V88C150 74 120 100 90 86S30 100 0 88Z"/></clipPath>
          <linearGradient id="fsh" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".16"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
          <g id="flg"><g clip-path="url(#fcl)"><rect width="180" height="48" fill="#fff"/><rect y="48" width="180" height="60" fill="#d4213d"/><rect width="180" height="110" fill="url(#fsh)"/></g></g>
        </defs>
        <rect width="520" height="240" fill="#2a1d22"/>
        <g opacity=".95">
          <use href="#flg" transform="translate(-40 40) rotate(-8) scale(1.1)"/>
          <line x1="-22" y1="30" x2="-6" y2="240" stroke="#222" stroke-width="5"/>
          <use href="#flg" transform="translate(120 -6) rotate(3) scale(1.45)"/>
          <line x1="124" y1="-6" x2="118" y2="240" stroke="#222" stroke-width="5"/>
          <use href="#flg" transform="translate(330 24) rotate(-4) scale(1.15)"/>
          <line x1="334" y1="20" x2="330" y2="240" stroke="#222" stroke-width="5"/>
          <use href="#flg" transform="translate(430 70) rotate(6) scale(.85)"/>
        </g>
      </svg></div>
      <div id="fshade"></div>
      <div id="ftext"><div id="frow"><span id="fl1"></span><span id="fam"></span></div><div id="fl2"></div></div>
      <div id="fstrip"><div id="ftrack"><div id="ffill"></div><div id="fpct">0%</div></div></div>
    </div>
  </div>

  <div id="livewrap" class="off"><div class="livebadge"><div class="ldot"></div><div class="ltxt" id="ltxt"></div></div></div>

  <div id="pstage">
    <div id="wipe"></div>
    <div id="pcard">
      <div class="pbadge">ZWYCIĘZCA</div>
      <div id="phead"><div id="ptitle"></div><div id="psub"></div></div>
      <div id="prows"></div>
      <div id="flash"></div>
    </div>
  </div>

  <div id="adwrap"><video id="adv" playsinline preload="auto"></video><div id="adlabel">REKLAMA</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get('key') || '';

/* ---------- zegar (Europe/Warsaw) ---------- */
const fmt = new Intl.DateTimeFormat('pl-PL', {timeZone:'Europe/Warsaw', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function clock(){ $('time').textContent = fmt.format(new Date()); }
clock(); setInterval(clock, 1000);

/* ---------- pasek: ticker bez przerw, stała prędkość px/s ---------- */
const track = $('track'), win = $('ticker');
function mkLap(news){
  const lap = document.createElement('div'); lap.className = 'lap';
  news.forEach(n => {
    const s = document.createElement('span'); s.className = 'news'; s.textContent = n;
    const b = document.createElement('span'); b.className = 'bullet';
    lap.append(s, b);
  });
  return lap;
}
function renderBar(c){
  $('l1').textContent = c.line1 || '';
  $('l2').textContent = c.line2 || '';
  $('l2').style.display = c.line2 ? '' : 'none';
  const news = (c.news && c.news.length) ? c.news : ['—'];
  track.style.animation = 'none';
  track.replaceChildren(mkLap(news));
  const lw = track.firstChild.getBoundingClientRect().width || 1;
  const reps = Math.max(1, Math.ceil(win.getBoundingClientRect().width / lw) + 1);
  const block = () => { const d = document.createElement('div'); d.className = 'lap'; for (let i = 0; i < reps; i++) d.append(...mkLap(news).childNodes); return d; };
  track.replaceChildren(block(), block());
  const dur = (track.getBoundingClientRect().width / 2) / (+c.speed || 106);
  void track.offsetWidth;
  track.style.animation = 'sc ' + dur + 's linear infinite';
}

/* ---------- sondaż (logika 1:1 z sondaz_tv.html) ---------- */
let timers = [], ht;
function shade(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return h;const n=parseInt(m[1],16);
  return 'rgb('+Math.round((n>>16&255)*.7)+','+Math.round((n>>8&255)*.7)+','+Math.round((n&255)*.7)+')'}
function buildPoll(cfg){
  const n = cfg.rows.length, rh = Math.max(54, Math.min(104, Math.floor(560/n) - 18));
  $('pcard').style.setProperty('--rh', rh + 'px');
  $('prows').style.setProperty('--gap', Math.max(10, 22 - n) + 'px');
  $('ptitle').textContent = cfg.title; $('psub').textContent = cfg.subtitle; $('psub').style.display = cfg.subtitle ? '' : 'none';
  const max = Math.max(...cfg.rows.map(r => +r.value || 0));
  $('prows').innerHTML = '';
  cfg.rows.forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'row' + ((+r.value||0) === max && max > 0 ? ' lead' : '');
    d.style.setProperty('--c', r.color); d.style.setProperty('--c2', shade(r.color)); d.style.setProperty('--i', i);
    d.innerHTML = '<div class="logo"></div><div class="name"></div><div class="track"><div class="bar"></div></div><div class="pct"><b>0</b><small>%</small></div>';
    const lg = d.querySelector('.logo');
    const letter = () => { lg.textContent = ''; const s = document.createElement('span'); s.textContent = (r.name || '?')[0]; lg.appendChild(s); };
    if (r.logo) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.onerror = letter; im.src = r.logo; lg.appendChild(im); }
    else letter();
    d.querySelector('.name').textContent = r.name;
    d._v = +r.value || 0; $('prows').appendChild(d);
  });
}
function count(el, to, ms){const b=el.querySelector('b'),t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);b.textContent=(to*e).toFixed(2).replace('.',',');if(k<1)requestAnimationFrame(f);else b.textContent=String(to).replace('.',',')})(t0)}
function showPoll(cfg){
  hidePoll(true); clearTimeout(ht); timers.forEach(clearTimeout); timers = [];
  buildPoll(cfg); const rows = [...document.querySelectorAll('#prows .row')];
  const mx = Math.max(0, ...rows.map(r => r._v));
  void $('pstage').offsetWidth; $('pstage').className = 'on';
  rows.forEach((el, i) => timers.push(setTimeout(() => {el.classList.add('go'); el.querySelector('.bar').style.width = (mx > 0 ? el._v/mx*100 : 0) + '%'; count(el, el._v, 1900)}, 1300 + i*380)));
  const end = 1300 + rows.length*380 + 2100;
  timers.push(setTimeout(() => {if (rows.some(r => r.classList.contains('lead'))) $('pstage').classList.add('win')}, end));
  if (+cfg.hideAfter > 0) ht = setTimeout(hidePoll, end + cfg.hideAfter*1000);
}
function hidePoll(quiet){
  clearTimeout(ht); timers.forEach(clearTimeout);
  if (quiet === true) { $('pstage').className = ''; return; }
  if ($('pstage').classList.contains('on')) { $('pstage').className = 'off'; timers = [setTimeout(() => {$('pstage').className = ''}, 800)]; }
}


/* ---------- reklamy: pliki /ads/1.mp4, 2.mp4 … (numerycznie) ---------- */
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1'; // podgląd w panelu = bez dźwięku
let adList = [], adScan = 0, adQueue = [], adCfg = {volume: 100}, adRot = 0, lastAdSeq = null, lastSlot = null;
try { const v = localStorage.getItem('overlay_ads_seq'); if (v !== null) lastAdSeq = +v; } catch (e) {}
async function scanAds(force){
  if (!force && Date.now() - adScan < 60000) return adList;
  adScan = Date.now(); const found = [];
  await Promise.all(Array.from({length: 40}, (_, i) => i + 1).map(async n => {
    try { const r = await fetch('/ads/' + n + '.mp4', {method: 'HEAD', cache: 'no-store'});
      if (r.ok && /video|octet/i.test(r.headers.get('content-type') || '')) found.push(n); } catch (e) {}
  }));
  return adList = found.sort((a, b) => a - b);
}
function endAds(){
  adQueue = []; const v = $('adv'); $('adwrap').classList.remove('on'); v.pause();
  setTimeout(() => { if (!$('adwrap').classList.contains('on')) v.removeAttribute('src'); }, 700);
}
function nextAd(){
  if (!adQueue.length) return endAds();
  const n = adQueue.shift(), v = $('adv');
  v.muted = PREVIEW; v.volume = Math.max(0, Math.min(1, (+adCfg.volume || 0) / 100));
  v.src = '/ads/' + n + '.mp4'; $('adwrap').classList.add('on');
  const p = v.play(); if (p) p.catch(() => { v.muted = true; v.play().catch(nextAd); });
}
$('adv').onended = nextAd; $('adv').onerror = () => { if ($('adwrap').classList.contains('on')) nextAd(); };
async function runAdCmd(c){
  if (c.action === 'stop') return endAds();
  const list = await scanAds(true); if (!list.length) return;
  if (c.action === 'all') adQueue = list.slice();
  else adQueue = [(c.n > 0 && list.includes(c.n)) ? c.n : list[adRot++ % list.length]];
  nextAd();
}
async function autoAd(slot){
  const list = await scanAds(false); if (!list.length || $('adwrap').classList.contains('on')) return;
  adQueue = [list[(slot - 1) % list.length]]; nextAd();
}

/* ---------- odpytywanie stanu co 2 s ---------- */
let barSig = '', lastSeq = null;
try { const v = localStorage.getItem('overlay_poll_seq'); if (v !== null) lastSeq = +v; } catch (e) {}
const setSeq = s => { lastSeq = s; try { localStorage.setItem('overlay_poll_seq', String(s)); } catch (e) {} };

function setVis(id, on){ $(id).classList.toggle('off', !on); }
function clearAll(){ setVis('barwrap', false); setVis('livewrap', false); setVis('fundwrap', false); setVis('qrwrap', false); }

/* zbiórka: % = wartość bazowa + 1% co N sekund (liczone wg czasu serwera) */
let fund = null, skew = 0, qrOk = false;
const qr = $('fqr'); qr.onload = () => { qrOk = true; showQr(); }; qr.onerror = () => { qrOk = false; showQr(); }; qr.src = '/assets/kodqr.png';
const bgImg = new Image(); bgImg.onload = () => { $('fbg').style.backgroundImage = 'url(/assets/zbiorka_bg.jpg)'; $('fbg').classList.add('photo'); }; bgImg.src = '/assets/zbiorka_bg.jpg';
function showQr(){ $('fqrbox').style.display = (fund && fund.showQr && qrOk) ? 'block' : 'none'; }
function fundPct(){
  if (!fund) return 0;
  const inc = fund.everySeconds > 0 ? Math.max(0, Date.now() + skew - Date.parse(fund.startedAt)) / 1000 / fund.everySeconds : 0;
  return Math.max(0, Math.min(100, Math.floor((+fund.percent || 0) + inc)));
}
function renderFund(){ const p = fundPct(); $('fpct').textContent = p + '%'; $('ffill').style.width = p + '%'; }
setInterval(renderFund, 500);

function apply(s){
  skew = Date.parse(s.serverNow) - Date.now();
  // każdy moduł osobno, żeby błąd w jednym nie blokował pozostałych
  try {
    const b = s.bar, sig = JSON.stringify([b.line1, b.line2, b.news, b.speed]);
    const sc = $('scene');
    sc.style.setProperty('--ox', b.offsetX + 'px'); sc.style.setProperty('--mb', b.marginBottom + 'px');
    if (sig !== barSig) { barSig = sig; renderBar(b); }
    setVis('barwrap', !!b.visible);
  } catch (e) { console.error('pasek', e); }

  try {
    const l = s.live_badge;
    $('ltxt').textContent = l.text;
    $('livewrap').style.setProperty('--lt', l.top + 'px'); $('livewrap').style.setProperty('--lr', l.right + 'px');
    setVis('livewrap', !!l.visible);
  } catch (e) { console.error('plakietka', e); }

  try {
    const f = s.fund; fund = f;
    $('fl1').textContent = f.line1; $('fam').textContent = f.amount; $('fl2').textContent = f.line2;
    $('fl1').style.display = f.line1 ? '' : 'none'; $('frow').style.display = (f.line1 || f.amount) ? '' : 'none'; $('fam').style.display = f.amount ? '' : 'none'; $('fl2').style.display = f.line2 ? '' : 'none';
    showQr(); renderFund();
    setVis('fundwrap', !!f.visible);
    setVis('qrwrap', !!f.visible);
  } catch (e) { console.error('zbiórka', e); }

  try {
    const c = s.poll_cmd;
    if (c && c.seq !== lastSeq) {
      const fresh = Date.parse(s.serverNow) - Date.parse(c.at) <= 30000;
      setSeq(c.seq);
      if (c.action === 'show' && fresh) showPoll(s.poll);
      else if (c.action === 'hide') hidePoll();
    }
  } catch (e) { console.error('sondaż', e); }

  try {
    const a = s.ads, c = s.ads_cmd; adCfg = a;
    if ($('adv').volume !== undefined && $('adwrap').classList.contains('on')) $('adv').volume = Math.max(0, Math.min(1, (+a.volume || 0) / 100));
    $('adlabel').style.display = a.label ? '' : 'none';
    if (c && c.seq !== lastAdSeq) {
      const fresh = Date.parse(s.serverNow) - Date.parse(c.at) <= 30000;
      lastAdSeq = c.seq; try { localStorage.setItem('overlay_ads_seq', String(c.seq)); } catch (e) {}
      if (c.action === 'stop' || fresh) runAdCmd(c);
    }
    if (+a.everyMinutes > 0) {
      const slot = Math.floor((Date.parse(s.serverNow) - Date.parse(a.startedAt)) / (a.everyMinutes * 60000));
      if (lastSlot !== null && slot > lastSlot && slot > 0) autoAd(slot);
      lastSlot = slot;
    } else lastSlot = null;
  } catch (e) { console.error('reklamy', e); }
}
async function poll(){
  if (!KEY) { clearAll(); return; }
  try {
    const r = await fetch('/api/state?key=' + encodeURIComponent(KEY), {cache: 'no-store'});
    if (!r.ok) { clearAll(); return; }
    apply(await r.json());
  } catch (e) { /* chwilowy brak sieci – zostawiamy stan jak jest */ }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { barSig = ''; });
poll(); setInterval(poll, 2000);
</script>
