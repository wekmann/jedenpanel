<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<title>JEDEN overlay</title>
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
html,body{margin:0;padding:0;background:transparent !important;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#scene{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent}

/* ===== PASEK DOLNY (jeden_pasek_calosc.html) ===== */
#barwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:var(--mb,43px);transition:transform .6s var(--ease)}
#barwrap.off{transform:translateY(calc(100% + var(--mb,43px) + 30px))}
#root{position:relative;width:1662px;height:214px;display:grid;grid-template-columns:155px 1507px;grid-template-rows:157px 57px}
#logo{background:#0a1a2e url(/assets/jeden_logo.png) center/cover no-repeat}
#clock{background:#081742;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#time{font-size:27px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.4);color:#fff;font-variant-numeric:tabular-nums}
#head{box-sizing:border-box;background:linear-gradient(90deg,#8d1123,#a3162a 55%,#c21c28);border-radius:0 18px 0 0;padding:14px 40px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45)}
#head::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#fff}
.line{color:#fff;font-family:'Roboto Condensed',Arial,sans-serif;font-size:46px;font-weight:700;text-transform:uppercase;letter-spacing:0;line-height:1.25;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.35)}
#ticker{background:#fff;overflow:hidden;position:relative;display:flex;align-items:center}
#ticker::before,#ticker::after{content:"";position:absolute;left:0;right:0;height:0;background:none;z-index:2}
#ticker::before{top:0}#ticker::after{bottom:0}
#track{display:flex;align-items:center;white-space:nowrap;width:max-content;will-change:transform}
.lap{display:flex;align-items:center;white-space:nowrap}
.news{color:#0b1d4a;font-family:'Roboto Condensed',Arial,sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:0}
.bullet{display:inline-block;width:10px;height:29px;background:#a3162a;margin:0 28px;transform:skewX(-25deg);flex-shrink:0}
@keyframes sc{to{transform:translateX(-50%)}}

/* ===== PLAKIETKA NA ŻYWO (live_badge_v2.html) ===== */
#livewrap{position:absolute;top:var(--lt,43px);right:var(--lr,53px);height:64px;transition:transform .6s var(--ease)}
#livewrap.off{transform:translateX(calc(100% + var(--lr,53px) + 30px))}
.livebadge{box-sizing:border-box;width:100%;height:100%;padding:0 30px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(90deg,#8d1123,#a3162a 55%,#c21c28);border-radius:8px;font-family:Arial,Helvetica,sans-serif;box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative;overflow:hidden}
.ldot{width:14px;height:14px;border-radius:50%;background-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);flex-shrink:0}
.ltxt{color:#fff;font-size:26px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.4)}

/* ===== WYNIKI ANKIETY NA ŻYWO – wykres kołowy, lewy górny róg ===== */
#pollwrap{position:absolute;top:var(--pt,43px);left:53px;width:440px;transition:transform .6s var(--ease),top .4s var(--ease)}
#pollwrap.off{transform:translateX(calc(-100% - 53px - 30px))}
#lpbox{background:#0e1c33;border-radius:0 18px 14px 14px;box-shadow:0 8px 22px rgba(0,0,0,.5);overflow:hidden}
#lphead{background:#d60f08;border-bottom:5px solid #7a0000;padding:10px 20px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.lpdot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);animation:lpp 1.4s ease-in-out infinite}
#lphead.end .lpdot{animation:none}
@keyframes lpp{50%{opacity:.3}}
#lptitle{padding:14px 20px 0;font-size:25px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#lppie{display:block;width:230px;height:230px;margin:10px auto 4px}
#lpslices circle{fill:none;stroke-width:100;transition:stroke-dasharray 1s var(--ease),stroke-dashoffset 1s var(--ease),stroke .4s}
#lplegend{padding:4px 20px 8px}
.lpr{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:22px;font-weight:700}
.lpc{width:16px;height:16px;border-radius:4px;flex-shrink:0}
.lpn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpp{font-variant-numeric:tabular-nums}
.lpv{color:#9fb2d4;font-size:18px;font-weight:400;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#lpfoot{display:flex;justify-content:space-between;gap:10px;padding:10px 20px 14px;font-size:18px;color:#9fb2d4;border-top:1px solid #2a3b5c}

/* ===== QR (nad logiem JEDEN, lewa krawędź i szerokość równo z logiem) ===== */
#qrwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:calc(var(--mb,43px) + 214px + 14px);transition:transform .6s var(--ease)}
#qrwrap.off{transform:translateX(calc(-100% - 129px - 60px))}
#fqrbox{box-sizing:border-box;width:155px;background:#fff;padding:8px;box-shadow:0 6px 14px rgba(0,0,0,.45);display:none}
#fqr{display:block;width:100%;height:auto}

/* ===== PLANSZA ROZMÓWCY / LOWER THIRD (nad paskiem, od lewej; omija QR gdy ten jest widoczny) ===== */
#ltwrap{position:absolute;left:calc(129px + var(--ox,0px) + var(--lx,0px));bottom:calc(var(--mb,43px) + 214px + 14px);max-width:940px;transition:transform .6s var(--ease),left .4s var(--ease)}
#ltwrap.off{transform:translateX(calc(-100% - 129px - var(--lx,0px) - 60px))}
#ltbox{display:flex;flex-direction:column;align-items:flex-start;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
#ltname{box-sizing:border-box;max-width:100%;background:#d60f08;color:#fff;font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:-.5px;line-height:1.2;padding:10px 40px 10px 28px;border-radius:0 18px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.35);border-bottom:5px solid #7a0000}
#ltrole{box-sizing:border-box;max-width:100%;background:#16305c;color:#fff;font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.2;padding:9px 40px 9px 28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== ZBIÓRKA (nad paskiem, prawa krawędź równo z paskiem; mały format jak w TV) ===== */
#fundwrap{--fscale:1.6;position:absolute;right:calc(129px - var(--ox,0px));bottom:calc(var(--mb,43px) + 214px + 14px);display:flex;align-items:flex-end;transition:transform .6s var(--ease)}
#fundwrap.off{transform:translateX(calc(100% + 500px))}
#fcard{position:relative;width:260px;zoom:var(--fscale);font-family:'Oswald','Roboto Condensed','Arial Narrow',Impact,Arial,sans-serif;text-transform:uppercase;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
#ftruck{display:block;width:100%;height:auto;margin-bottom:-4px}
#fdish{transform-origin:420px 62px;animation:fdish 7s ease-in-out infinite}
@keyframes fdish{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
#frow{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:4px;white-space:nowrap;line-height:1}
#fl1,#fam,#fl2{-webkit-text-stroke:3px #151515;paint-order:stroke fill;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#fl1{font-size:15px;font-weight:700;color:#f4f4f4;letter-spacing:.3px}
#fam{font-size:32px;font-weight:700;color:#2bb8e6;letter-spacing:.5px}
#fam small{font-size:20px;text-transform:none}
#fl2{font-size:25px;font-weight:700;color:#f4f4f4;line-height:1.05;text-align:center;white-space:nowrap;margin-top:1px;letter-spacing:.3px}
#fstrip{position:relative;margin-top:4px}
#ftrack{position:relative;height:28px;box-sizing:border-box;background:linear-gradient(180deg,#4d6a7e,#2f4a5c);border:2px solid #e6ebf0;outline:1px solid #1d2b36;overflow:hidden}
#ffill{position:relative;height:100%;width:0;background:linear-gradient(180deg,#52b83a 0,#3f9b2a 45%,#2a741b);transition:width .8s var(--ease);overflow:hidden}
#ffill::after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:fshine 4s ease-in-out infinite}
@keyframes fshine{0%{left:-60px}55%,100%{left:120%}}
#fpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ===== OZNACZENIE WIEKU (lewy górny róg; pliki /assets/wiek_7.png, wiek_12.png, wiek_16.png, wiek_18.png) ===== */
#agewrap{position:absolute;top:43px;left:53px;height:72px;transition:transform .6s var(--ease)}
#agewrap.off{transform:translateX(calc(-100% - 53px - 30px))}
#ageimg{display:block;height:100%;width:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}

/* ===== REKLAMY (pełny ekran, pliki public/ads/1.mp4, 2.mp4 …) ===== */
#adwrap{position:absolute;inset:0;background:#000;opacity:0;visibility:hidden;z-index:50;transition:opacity .5s,visibility 0s .5s}
#adwrap.on{opacity:1;visibility:visible;transition:opacity .5s}
#adv{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#adlabel{position:absolute;top:43px;left:53px;background:#d60f08;color:#fff;font:800 24px Arial,sans-serif;letter-spacing:1px;padding:8px 18px;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.45)}

/* ===== PRZERWA / ZARAZ WRACAMY ===== */
#brk{position:absolute;inset:0;z-index:40;overflow:hidden;opacity:0;visibility:hidden;background:#050d1c;font-family:'Oswald','Arial Narrow',Impact,Arial,sans-serif;text-transform:uppercase;transition:opacity .7s,visibility 0s .7s}
#brk.on{opacity:1;visibility:visible;transition:opacity .7s}
.bk-bg{position:absolute;inset:0;background:radial-gradient(1100px 700px at 15% 10%,#16305c,transparent 60%),radial-gradient(900px 700px at 90% 95%,#8a0a0a,transparent 55%),linear-gradient(160deg,#08142a,#050d1c 60%,#12060a)}
.bk-st{position:absolute;inset:-200px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 54px);animation:bkst 12s linear infinite}
@keyframes bkst{to{transform:translateX(59.6px)}}
.bk-sw{position:absolute;top:0;bottom:0;width:380px;left:-500px;background:linear-gradient(100deg,transparent,rgba(255,80,60,.22),transparent);transform:skewX(-20deg);animation:bksw 7s ease-in-out infinite}
@keyframes bksw{0%{left:-500px}60%,100%{left:2000px}}
#bkp i{position:absolute;bottom:-20px;border-radius:50%;background:#fff;animation:bkr linear infinite}
@keyframes bkr{to{transform:translateY(-1150px);opacity:0}}
#bkl{position:absolute;left:150px;top:50%;transform:translateY(-50%);width:900px}
#bklogo{width:130px;height:130px;background:#0a1a2e url(/assets/jeden_logo.png) center/cover no-repeat;border-bottom:6px solid #d60f08;box-shadow:0 10px 30px rgba(0,0,0,.5);margin-bottom:46px}
#bkt{font-size:190px;font-weight:700;line-height:.95;letter-spacing:2px;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6);transform:translateY(50px);opacity:0;transition:transform 1s var(--ease) .3s,opacity 1s .3s}
#bkline{height:10px;width:0;background:linear-gradient(90deg,#d60f08,#ff6b3d);margin:26px 0;transition:width 1.2s var(--ease) .6s;box-shadow:0 0 24px rgba(255,59,59,.7)}
#bks{font-size:46px;font-weight:600;opacity:0;color:#cfd8e6;letter-spacing:1px;transition:opacity 1s .9s}
#bkat{display:inline-block;margin-top:34px;padding:10px 28px;background:#d60f08;border-radius:0 14px 0 0;font-size:34px;font-weight:700;letter-spacing:1px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
#brk.on #bkt{transform:none;opacity:1}#brk.on #bkline{width:420px}#brk.on #bks{opacity:1}
#bkr{position:absolute;right:130px;top:50%;width:600px;height:600px;transform:translateY(-50%)}
#bkr svg{position:absolute;inset:0;width:100%;height:100%}
#bkd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#bkdig{font-size:170px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 6px 24px rgba(0,0,0,.6)}
#bklab{font-size:30px;letter-spacing:4px;color:#9fb3d1;margin-top:10px}
#bkf{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:28px;letter-spacing:6px;color:#8ea2c4}
#brk.zero #bkdig{animation:bkp 1s ease-in-out infinite}@keyframes bkp{50%{transform:scale(1.06)}}
#bkarc{transition:stroke-dashoffset .4s linear;filter:drop-shadow(0 0 18px rgba(255,59,59,.8))}
#bktk{transform-origin:300px 300px;animation:bkspin 80s linear infinite}@keyframes bkspin{to{transform:rotate(360deg)}}

/* ===== SONDAŻ (sondaz_tv.html) ===== */
#pstage{position:absolute;inset:0;pointer-events:none}
#wipe{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,#dc0432 40%,#ff3b3b 60%,transparent);transform:skewX(-20deg);opacity:0}
#pstage.on #wipe{animation:wipe 1.1s var(--ease) forwards}
@keyframes wipe{0%{left:-40%;opacity:.95}100%{left:120%;opacity:0}}
#pcard{position:absolute;left:50%;top:50%;width:1400px;transform:translate(-50%,-46%) scale(.94);opacity:0;clip-path:inset(0 100% 0 0 round 18px);
 background:linear-gradient(160deg,#0e1c33,#060f1e);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.8);
 transition:clip-path 1s var(--ease) .25s,transform 1s var(--ease) .25s,opacity .4s .25s}
#pstage.on #pcard{opacity:1;transform:translate(-50%,-50%) scale(1);clip-path:inset(0 0 0 0 round 18px)}
#pcard::before{content:"";position:absolute;inset:0;border-radius:18px;padding:3px;background:linear-gradient(120deg,#dc2626,#ff6b3d,#dc2626,#7a0000);background-size:300% 300%;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:bs 6s ease infinite;pointer-events:none}
@keyframes bs{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#phead{background:linear-gradient(90deg,#a10000,#e6130a 60%,#ff3b3b);padding:26px 48px 22px;position:relative;overflow:hidden}
#phead::after{content:"";position:absolute;top:0;bottom:0;width:160px;left:-200px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
#pstage.on #phead::after{animation:sweep 1.4s ease 1.2s}
@keyframes sweep{to{left:110%}}
#ptitle{font-size:46px;font-weight:900;letter-spacing:-.5px;text-shadow:0 3px 8px rgba(0,0,0,.4)}
#psub{font-size:20px;opacity:.85;margin-top:6px;font-weight:600}
#prows{padding:34px 48px 40px;display:flex;flex-direction:column;gap:var(--gap,18px)}
.row{display:flex;align-items:center;gap:22px;height:var(--rh,96px);opacity:0;transform:translateX(-80px);transition:transform .8s var(--ease) calc(.5s + var(--i)*.18s),opacity .5s calc(.5s + var(--i)*.18s),filter .6s}
#pstage.on .row{opacity:1;transform:none}
#pstage.win .row{transition:transform .6s,opacity .6s,filter .6s}
.logo{width:var(--rh,96px);height:var(--rh,96px);flex:none;border-radius:50%;background:#fff;border:5px solid var(--c);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo span{font-size:calc(var(--rh,96px)*.45);font-weight:900;color:var(--c)}
.name{width:260px;flex:none;font-size:34px;font-weight:800;line-height:1.05}
.track{flex:1;height:calc(var(--rh,96px)*.62);background:rgba(255,255,255,.08);border-radius:40px;overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.bar{height:100%;width:0;border-radius:40px;background:linear-gradient(90deg,var(--c2,#444),var(--c,#888));position:relative;overflow:hidden;
 transition:width 1.9s cubic-bezier(.22,1,.36,1)}
.bar::after{content:"";position:absolute;top:0;bottom:0;width:90px;left:-120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
.go .bar::after{animation:sweep 1.4s ease 1.6s}
.pct{width:190px;flex:none;text-align:right;font-size:58px;font-weight:900;font-variant-numeric:tabular-nums}
.pct small{font-size:30px;opacity:.8}
.pbadge{position:absolute;right:30px;top:18px;background:#ffd23a;color:#111;font-weight:900;font-size:18px;letter-spacing:1px;padding:7px 16px;border-radius:20px;opacity:0;transform:scale(.4) rotate(-8deg);transition:.5s cubic-bezier(.34,1.8,.5,1);z-index:3}
#pstage.win .pbadge{opacity:1;transform:scale(1) rotate(-4deg)}
#pstage.win .row:not(.lead){opacity:.55;filter:saturate(.6)}
#pstage.win .row.lead{transform:scale(1.025)}
#pstage.win .row.lead .bar{box-shadow:0 0 40px var(--c),0 0 90px var(--c);animation:pulse 1.2s ease-in-out infinite}
#pstage.win .row.lead .logo{animation:pop .7s cubic-bezier(.34,1.8,.5,1)}
@keyframes pulse{50%{filter:brightness(1.35)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#pstage.win #flash{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.45}100%{opacity:0}}
#pstage.off #pcard{opacity:0;transform:translate(-50%,-56%) scale(.96);clip-path:inset(0 0 0 100% round 18px);transition:all .7s ease-in}
</style>
</head>
<body>
<div id="scene">
  <div id="barwrap" class="off">
    <div id="root">
      <div id="logo"></div>
      <div id="head"><div class="line" id="l1"></div><div class="line" id="l2"></div></div>
      <div id="clock"><div id="time">00:00</div></div>
      <div id="ticker"><div id="track"></div></div>
    </div>
  </div>

  <div id="qrwrap" class="off">
    <div id="fqrbox"><img id="fqr" alt=""></div>
  </div>

  <div id="ltwrap" class="off">
    <div id="ltbox"><div id="ltname"></div><div id="ltrole"></div></div>
  </div>

  <div id="fundwrap" class="off">
    <div id="fcard">
      <svg id="ftruck" viewBox="0 0 560 190" aria-hidden="true">
        <defs>
          <linearGradient id="gTr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3159e0"/><stop offset=".55" stop-color="#2347c8"/><stop offset="1" stop-color="#1a37a3"/></linearGradient>
          <linearGradient id="gCab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dee4"/></linearGradient>
          <linearGradient id="gGl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d4468"/><stop offset="1" stop-color="#121c30"/></linearGradient>
          <linearGradient id="gDish" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7ec"/><stop offset="1" stop-color="#8d949e"/></linearGradient>
        </defs>
        <!-- antena satelitarna -->
        <polygon points="412,56 428,56 425,72 415,72" fill="#6b7078"/>
        <g id="fdish">
          <ellipse cx="420" cy="34" rx="37" ry="29" fill="url(#gDish)" stroke="#5b6068" stroke-width="3"/>
          <ellipse cx="420" cy="34" rx="27" ry="20" fill="#767c85"/>
          <ellipse cx="420" cy="34" rx="9" ry="6" fill="#d3d8de"/>
          <line x1="420" y1="34" x2="438" y2="8" stroke="#4a4f56" stroke-width="3" stroke-linecap="round"/>
          <circle cx="439" cy="7" r="4" fill="#4a4f56"/>
        </g>
        <!-- naczepa / wóz transmisyjny -->
        <rect x="150" y="66" width="404" height="90" rx="7" fill="url(#gTr)"/>
        <rect x="150" y="66" width="404" height="9" rx="4" fill="#1a37a3"/>
        <rect x="196" y="56" width="46" height="12" rx="2" fill="#1a37a3"/>
        <rect x="256" y="58" width="22" height="9" rx="2" fill="#16308c"/>
        <rect x="150" y="132" width="404" height="24" fill="#1a37a3"/>
        <rect x="150" y="130" width="404" height="3" fill="#5f84ff" opacity=".55"/>
        <rect x="296" y="86" width="38" height="36" rx="3" fill="url(#gGl)"/>

<script>
const $ = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get('key') || '';

/* ---------- zegar (Europe/Warsaw) ---------- */
const fmt = new Intl.DateTimeFormat('pl-PL', {timeZone:'Europe/Warsaw', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function clock(){ $('time').textContent = fmt.format(new Date()); }
clock(); setInterval(clock, 1000);

/* ---------- pasek: ticker bez przerw, stała prędkość px/s ---------- */
const track = $('track'), win = $('ticker');
function mkLap(news){
  const lap = document.createElement('div'); lap.className = 'lap';
  news.forEach(n => {
    const s = document.createElement('span'); s.className = 'news'; s.textContent = n;
    const b = document.createElement('span'); b.className = 'bullet';
    lap.append(s, b);
  });
  return lap;
}
function renderBar(c){
  $('l1').textContent = c.line1 || '';
  $('l2').textContent = c.line2 || '';
  $('l2').style.display = c.line2 ? '' : 'none';
  const news = (c.news && c.news.length) ? c.news : ['—'];
  track.style.animation = 'none';
  track.replaceChildren(mkLap(news));
  const lw = track.firstChild.getBoundingClientRect().width || 1;
  const reps = Math.max(1, Math.ceil(win.getBoundingClientRect().width / lw) + 1);
  const block = () => { const d = document.createElement('div'); d.className = 'lap'; for (let i = 0; i < reps; i++) d.append(...mkLap(news).childNodes); return d; };
  track.replaceChildren(block(), block());
  const dur = (track.getBoundingClientRect().width / 2) / (+c.speed || 106);
  void track.offsetWidth;
  track.style.animation = 'sc ' + dur + 's linear infinite';
}

/* ---------- sondaż (logika 1:1 z sondaz_tv.html) ---------- */
let timers = [], ht;
function shade(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return h;const n=parseInt(m[1],16);
  return 'rgb('+Math.round((n>>16&255)*.7)+','+Math.round((n>>8&255)*.7)+','+Math.round((n&255)*.7)+')'}
function buildPoll(cfg){
  const n = cfg.rows.length, rh = Math.max(54, Math.min(104, Math.floor(560/n) - 18));
  $('pcard').style.setProperty('--rh', rh + 'px');
  $('prows').style.setProperty('--gap', Math.max(10, 22 - n) + 'px');
  $('ptitle').textContent = cfg.title; $('psub').textContent = cfg.subtitle; $('psub').style.display = cfg.subtitle ? '' : 'none';
  const max = Math.max(...cfg.rows.map(r => +r.value || 0));
  $('prows').innerHTML = '';
  cfg.rows.forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'row' + ((+r.value||0) === max && max > 0 ? ' lead' : '');
    d.style.setProperty('--c', r.color); d.style.setProperty('--c2', shade(r.color)); d.style.setProperty('--i', i);
    d.innerHTML = '<div class="logo"></div><div class="name"></div><div class="track"><div class="bar"></div></div><div class="pct"><b>0</b><small>%</small></div>';
    const lg = d.querySelector('.logo');
    const letter = () => { lg.textContent = ''; const s = document.createElement('span'); s.textContent = (r.name || '?')[0]; lg.appendChild(s); };
    if (r.logo) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.onerror = letter; im.src = r.logo; lg.appendChild(im); }
    else letter();
    d.querySelector('.name').textContent = r.name;
    d._v = +r.value || 0; $('prows').appendChild(d);
  });
}
function count(el, to, ms){const b=el.querySelector('b'),t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);b.textContent=(to*e).toFixed(2).replace('.',',');if(k<1)requestAnimationFrame(f);else b.textContent=String(to).replace('.',',')})(t0)}
function showPoll(cfg){
  hidePoll(true); clearTimeout(ht); timers.forEach(clearTimeout); timers = [];
  buildPoll(cfg); const rows = [...document.querySelectorAll('#prows .row')];
  const mx = Math.max(0, ...rows.map(r => r._v));
  void $('pstage').offsetWidth; $('pstage').className = 'on';
  rows.forEach((el, i) => timers.push(setTimeout(() => {el.classList.add('go'); el.querySelector('.bar').style.width = (mx > 0 ? el._v/mx*100 : 0) + '%'; count(el, el._v, 1900)}, 1300 + i*380)));
  const end = 1300 + rows.length*380 + 2100;
  timers.push(setTimeout(() => {if (rows.some(r => r.classList.contains('lead'))) $('pstage').classList.add('win')}, end));
  if (+cfg.hideAfter > 0) ht = setTimeout(hidePoll, end + cfg.hideAfter*1000);
}
function hidePoll(quiet){
  clearTimeout(ht); timers.forEach(clearTimeout);
  if (quiet === true) { $('pstage').className = ''; return; }
  if ($('pstage').classList.contains('on')) { $('pstage').className = 'off'; timers = [setTimeout(() => {$('pstage').className = ''}, 800)]; }
}


/* ---------- reklamy: pliki /ads/1.mp4, 2.mp4 … (numerycznie) ---------- */
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1'; // podgląd w panelu = bez dźwięku
let adList = [], adScan = 0, adQueue = [], adCfg = {volume: 100}, adRot = 0, lastAdSeq = null, lastSlot = null;
try { const v = localStorage.getItem('overlay_ads_seq'); if (v !== null) lastAdSeq = +v; } catch (e) {}
async function scanAds(force){
  if (!force && Date.now() - adScan < 60000) return adList;
  adScan = Date.now(); const found = [];
  await Promise.all(Array.from({length: 40}, (_, i) => i + 1).map(async n => {
    try { const r = await fetch('/ads/' + n + '.mp4', {method: 'HEAD', cache: 'no-store'});
      if (r.ok && /video|octet/i.test(r.headers.get('content-type') || '')) found.push(n); } catch (e) {}
  }));
  return adList = found.sort((a, b) => a - b);
}
function endAds(){
  adQueue = []; const v = $('adv'); $('adwrap').classList.remove('on'); v.pause();
  setTimeout(() => { if (!$('adwrap').classList.contains('on')) v.removeAttribute('src'); }, 700);
}
function nextAd(){
  if (!adQueue.length) return endAds();
  const n = adQueue.shift(), v = $('adv');
  v.muted = PREVIEW; v.volume = Math.max(0, Math.min(1, (+adCfg.volume || 0) / 100));
  v.src = '/ads/' + n + '.mp4'; $('adwrap').classList.add('on');
  const p = v.play(); if (p) p.catch(() => { v.muted = true; v.play().catch(nextAd); });
}
$('adv').onended = nextAd; $('adv').onerror = () => { if ($('adwrap').classList.contains('on')) nextAd(); };
async function runAdCmd(c){
  if (c.action === 'stop') return endAds();
  const list = await scanAds(true); if (!list.length) return;
  if (c.action === 'all') adQueue = list.slice();
  else adQueue = [(c.n > 0 && list.includes(c.n)) ? c.n : list[adRot++ % list.length]];
  nextAd();
}
async function autoAd(slot){
  const list = await scanAds(false); if (!list.length || $('adwrap').classList.contains('on')) return;
  adQueue = [list[(slot - 1) % list.length]]; nextAd();
}

/* ---------- przerwa / zaraz wracamy (+ podgląd: ?demo=break lub ?demo=brb) ---------- */
const DEMO = new URLSearchParams(location.search).get('demo');
let brk = null, brkTotal = 1, brkKey = '', bmVol = 0, bmT = null, bmKind = '', bmSig = '';
const bm = new Audio(); bm.loop = true; bm.muted = PREVIEW;
let useGen = false, gen = null;
// brak plików mp3 w /assets -> muzyka generowana w przeglądarce (działa też w OBS)
function setVol(v){ bm.volume = v; if (gen) gen.gain.value = v * 0.35; }
function ensureGen(){
  if (gen || PREVIEW) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    [[110,0.5],[164.81,0.3],[220,0.25],[277.18,0.12]].forEach(([f,a],i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = a;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03;
      const lg = ctx.createGain(); lg.gain.value = a * 0.5; lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(master); o.start(); lfo.start();
    });
    if (ctx.resume) ctx.resume();
    gen = master;
  } catch (e) { console.error('muzyka przerwy', e); }
}
bm.onerror = () => {
  if (!bm.src.endsWith('/assets/muzyka.mp3')) return;
  useGen = true; ensureGen(); // brak muzyka.mp3 -> generowane tło
};
for (let i = 0; i < 20; i++) { const p = document.createElement('i'), z = 4 + Math.random()*8; p.style.cssText = 'left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(10+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s;opacity:'+(.2+Math.random()*.5); $('bkp').appendChild(p); }
function bmGo(want, vol, kind){
  clearInterval(bmT);
  if (want) {
    if (bmKind !== kind) { bmKind = kind; bm.src = '/assets/muzyka.mp3'; setVol(0); bmVol = 0; }
    if (useGen) ensureGen(); else if (bm.paused) { const p = bm.play(); if (p) p.catch(() => {}); }
  }
  bmT = setInterval(() => {
    const t = want ? vol : 0; bmVol += Math.sign(t - bmVol) * Math.min(.04, Math.abs(t - bmVol)); setVol(Math.max(0, Math.min(1, bmVol)));
    if (Math.abs(t - bmVol) < .001) { clearInterval(bmT); if (!want) { bm.pause(); bmKind = ''; } }
  }, 60);
}
function renderBreak(k){
  const on = !!(k && k.visible); brk = on ? k : null; $('brk').classList.toggle('on', on);
  if (!on) { bmSig = ''; bmGo(false, 0, ''); $('brk').classList.remove('zero'); return; }
  const start = k.kind === 'start', brb = k.kind === 'brb' || start;
  $('bkt').textContent = k.title || (start ? 'Zaraz zaczynamy' : brb ? 'Zaraz wracamy' : 'Przerwa');
  $('bks').textContent = k.subtitle ? k.subtitle : (start ? 'Już za chwilę startujemy' : brb ? 'Nie odchodź od ekranu' : 'Wrócimy za chwilę');
  $('bkf').textContent = k.footer || '';
  const end = k.endsAt ? Date.parse(k.endsAt) : 0, key = (k.endsAt || '') + '|' + (k.startedAt || '');
  if (key !== brkKey) { brkKey = key; brkTotal = end ? Math.max(1, (end - (k.startedAt ? Date.parse(k.startedAt) : Date.now() + skew)) / 1000) : 1; }
  $('bkat').style.display = end ? '' : 'none'; if (end) $('bkat').textContent = (start ? 'Startujemy o ' : 'Wracamy o ') + fmt.format(new Date(end));
  brkTick();
}
function brkTick(){
  if (!brk) return;
  const end = brk.endsAt ? Date.parse(brk.endsAt) : 0;
  if (end) {
    const rem = (end - (Date.now() + skew)) / 1000, s = Math.max(0, Math.ceil(rem)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), p2 = n => String(n).padStart(2, '0');
    $('bkdig').textContent = (h ? h + ':' : '') + p2(m) + ':' + p2(s % 60); $('bkdig').style.fontSize = h ? '120px' : '';
    $('bkarc').style.strokeDashoffset = 1602.2 * (1 - Math.max(0, Math.min(1, rem / brkTotal)));
    $('bklab').textContent = s ? 'odliczanie do godziny ' + fmt.format(new Date(end)) : 'już za chwilę';
    $('brk').classList.toggle('zero', !s);
  } else { $('bkdig').textContent = '···'; $('bkarc').style.strokeDashoffset = 0; $('bklab').textContent = ''; $('brk').classList.remove('zero'); }
  const want = brk.music !== false && !$('adwrap').classList.contains('on'), vol = (brk.volume != null ? +brk.volume : 60) / 100, kind = brk.kind === 'brb' ? 'brb' : 'break', sig = want + '|' + vol + '|' + kind;
  if (sig !== bmSig) { bmSig = sig; bmGo(want, vol, kind); }
}
setInterval(brkTick, 250);
document.addEventListener('pointerdown', () => { bmSig = ''; });

/* ---------- odpytywanie stanu co 2 s ---------- */
let barSig = '', lastSeq = null;
try { const v = localStorage.getItem('overlay_poll_seq'); if (v !== null) lastSeq = +v; } catch (e) {}
const setSeq = s => { lastSeq = s; try { localStorage.setItem('overlay_poll_seq', String(s)); } catch (e) {} };

let ltPrev = false, ltT = null, ltForceOff = false; // plansza rozmówcy
function setVis(id, on){ $(id).classList.toggle('off', !on); }
function clearAll(){ setVis('barwrap', false); setVis('livewrap', false); setVis('fundwrap', false); setVis('qrwrap', false); setVis('ltwrap', false); setVis('pollwrap', false); setAge(AGE_URL || 0); renderBreak(null); }

/* zbiórka: % = wartość bazowa + 1% co N sekund (liczone wg czasu serwera); teksty wpisane na stałe w HTML */
let fund = null, skew = 0, qrOk = false;
const qr = $('fqr'); qr.onload = () => { qrOk = true; showQr(); }; qr.onerror = () => { qrOk = false; showQr(); }; qr.src = '/assets/kodqr.png';
function showQr(){
  const on = !!(fund && fund.showQr && qrOk);
  $('fqrbox').style.display = on ? 'block' : 'none';
  $('scene').style.setProperty('--lx', (on && fund.visible) ? '169px' : '0px'); // plansza rozmówcy omija QR
}
function fundPct(){
  if (!fund) return 0;
  const inc = fund.everySeconds > 0 ? Math.max(0, Date.now() + skew - Date.parse(fund.startedAt)) / 1000 / fund.everySeconds : 0;
  return Math.max(0, Math.min(100, Math.floor((+fund.percent || 0) + inc)));
}
function renderFund(){ const p = fundPct(); $('fpct').textContent = p + '%'; $('ffill').style.width = p + '%'; }
setInterval(renderFund, 500);

/* oznaczenie wieku: stan serwera s.age = {visible, rating} albo ?age=12 w adresie overlayu */
const AGE_OK = [7, 12, 16, 18], AGE_URL = +(new URLSearchParams(location.search).get('age')) || 0;
const ageImg = $('ageimg'); let ageShown = 0;
function setAge(r){
  r = AGE_OK.includes(+r) ? +r : 0;
  if (r && r !== ageShown) ageImg.src = '/assets/wiek_' + r + '.png';
  ageShown = r;
  setVis('agewrap', !!r);
  $('scene').style.setProperty('--pt', r ? '129px' : '43px');
}
ageImg.onerror = () => { ageShown = 0; setVis('agewrap', false); $('scene').style.setProperty('--pt', '43px'); };

function apply(s){
  skew = Date.parse(s.serverNow) - Date.now();
  // każdy moduł osobno, żeby błąd w jednym nie blokował pozostałych
  try {
    const b = s.bar, sig = JSON.stringify([b.line1, b.line2, b.news, b.speed]);
    const sc = $('scene');
    sc.style.setProperty('--ox', b.offsetX + 'px'); sc.style.setProperty('--mb', b.marginBottom + 'px');
    if (sig !== barSig) { barSig = sig; renderBar(b); }
    setVis('barwrap', !!b.visible);
  } catch (e) { console.error('pasek', e); }

  try {
    const l = s.live_badge;
    $('ltxt').textContent = l.text;
    $('livewrap').style.setProperty('--lt', l.top + 'px'); $('livewrap').style.setProperty('--lr', l.right + 'px');
    setVis('livewrap', !!l.visible);
  } catch (e) { console.error('plakietka', e); }

  try {
    const f = s.fund; fund = f;
    showQr(); renderFund();
    setVis('fundwrap', !!f.visible);
    setVis('qrwrap', !!f.visible);
  } catch (e) { console.error('zbiórka', e); }

  try { const a = s.age; setAge(AGE_URL || (a && a.visible ? a.rating : 0)); } catch (e) { console.error('wiek', e); }

  try { renderBreak(s.break_screen); } catch (e) { console.error('przerwa', e); }

  try {
    const l = s.lower_third;
    if (l && l.name) {
      $('ltname').textContent = l.name;
      $('ltrole').textContent = l.role || '';
      $('ltrole').style.display = l.role ? '' : 'none';
      const on = !!l.visible;
      if (on && !ltPrev) {
        ltForceOff = false; clearTimeout(ltT);
        if (+l.hideAfter > 0) ltT = setTimeout(() => { ltForceOff = true; setVis('ltwrap', false); }, l.hideAfter * 1000);
      }
      if (!on) { clearTimeout(ltT); ltForceOff = false; }
      ltPrev = on;
      setVis('ltwrap', on && !ltForceOff);
    } else { ltPrev = false; setVis('ltwrap', false); }
  } catch (e) { console.error('plansza', e); }

  try {
    const c = s.poll_cmd;
    if (c && c.seq !== lastSeq) {
      const fresh = Date.parse(s.serverNow) - Date.parse(c.at) <= 30000;
      setSeq(c.seq);
      if (c.action === 'show' && fresh) showPoll(s.poll);
      else if (c.action === 'hide') hidePoll();
    }
  } catch (e) { console.error('sondaż', e); }

  try {
    const a = s.ads, c = s.ads_cmd; adCfg = a;
    if ($('adv').volume !== undefined && $('adwrap').classList.contains('on')) $('adv').volume = Math.max(0, Math.min(1, (+a.volume || 0) / 100));
    $('adlabel').style.display = a.label ? '' : 'none';
    if (c && c.seq !== lastAdSeq) {
      const fresh = Date.parse(s.serverNow) - Date.parse(c.at) <= 30000;
      lastAdSeq = c.seq; try { localStorage.setItem('overlay_ads_seq', String(c.seq)); } catch (e) {}
      if (c.action === 'stop' || fresh) runAdCmd(c);
    }
    if (+a.everyMinutes > 0) {
      const slot = Math.floor((Date.parse(s.serverNow) - Date.parse(a.startedAt)) / (a.everyMinutes * 60000));
      if (lastSlot !== null && slot > lastSlot && slot > 0) autoAd(slot);
      lastSlot = slot;
    } else lastSlot = null;
  } catch (e) { console.error('reklamy', e); }
}
async function poll(){
  if (DEMO) { if (!brk) renderBreak({visible: true, kind: DEMO === 'brb' ? 'brb' : 'break', endsAt: new Date(Date.now() + 300000).toISOString(), footer: 'jeden.tv'}); return; }
  if (!KEY) { clearAll(); return; }
  try {
    const r = await fetch('/api/state?key=' + encodeURIComponent(KEY), {cache: 'no-store'});
    if (!r.ok) { clearAll(); return; }
    apply(await r.json());
  } catch (e) { /* chwilowy brak sieci – zostawiamy stan jak jest */ }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { barSig = ''; });
poll(); setInterval(poll, 2000);

/* ---------- wykres kołowy: wyniki ankiety na żywo (odświeżanie co 12 s) ---------- */
const LP_COL = ['#dc2626', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2', '#db2777', '#64748b'];
const LP_C = 2 * Math.PI * 50;
const lpEsc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function lpRender(d){
  let rows = d.rows.slice().sort((a, b) => b.n - a.n);
  if (rows.length > 8) rows = rows.slice(0, 7).concat({name: 'Pozostałe', n: rows.slice(7).reduce((s, x) => s + x.n, 0)});
  const tot = rows.reduce((s, x) => s + x.n, 0), g = $('lpslices');
  const slices = tot ? rows : [{name: '', n: 1}];
  while (g.children.length < slices.length) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', 100); c.setAttribute('cy', 100); c.setAttribute('r', 50);
    c.style.strokeDasharray = '0 ' + LP_C; c.style.strokeDashoffset = '0';
    g.appendChild(c);
  }
  while (g.children.length > slices.length) g.removeChild(g.lastChild);
  let cum = 0;
  slices.forEach((x, i) => {
    const frac = x.n / (tot || 1), c = g.children[i];
    c.style.stroke = tot ? LP_COL[i % 8] : '#2a3b5c';
    c.style.strokeDasharray = Math.max(0, frac * LP_C - (slices.length > 1 ? 1.5 : 0)) + ' ' + LP_C;
    c.style.strokeDashoffset = -cum * LP_C;
    cum += frac;
  });
  $('lptitle').textContent = d.title;
  $('lpstat').textContent = d.status === 'closed' ? 'Wyniki końcowe' : 'Wyniki na żywo';
  $('lphead').classList.toggle('end', d.status === 'closed');
  $('lplegend').innerHTML = rows.map((x, i) =>
    '<div class="lpr"><div class="lpc" style="background:' + LP_COL[i % 8] + '"></div><div class="lpn">' + lpEsc(x.name) + '</div>' +
    '<div class="lpp">' + (tot ? Math.round(x.n / tot * 100) : 0) + '%</div><div class="lpv">' + x.n + '</div></div>').join('');
  $('lptot').textContent = 'Oddano głosów: ' + tot;
  $('lpurl').textContent = 'Głosuj: ' + location.host + '/glosuj';
}
async function livePoll(){
  if (DEMO || !KEY) return;
  try {
    const r = await fetch('/api/ankieta?a=live&key=' + encodeURIComponent(KEY), {cache: 'no-store'});
    if (!r.ok) { setVis('pollwrap', false); return; }
    const d = await r.json();
    if (d.show) { lpRender(d); setVis('pollwrap', true); } else setVis('pollwrap', false);
  } catch (e) { /* chwilowy brak sieci – zostawiamy jak jest */ }
}
livePoll(); setInterval(livePoll, 12000);
