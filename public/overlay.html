<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<script>
/* tryb PGM = obraz z gry + overlay, wyskalowane do okna. Przezroczysty overlay (OBS): dopisz &clean=1 do adresu */
(function(){var q=new URLSearchParams(location.search),f=false;try{f=window.top!==window.self}catch(e){f=true}
window.EGRESS=q.has('egress');
/* PGM (obraz z gry w chmurze) tylko dla wysyłki na platformy (&egress=1) albo po dopisaniu &pgm=1; zwykły link to przezroczysty overlay (OBS) */
window.PGM=window.EGRESS||(q.get('pgm')==='1'&&!f);
/* lite (bez dekoracyjnych pętli animacji) domyślnie w PGM i wysyłce z chmury – płynniejszy obraz; &lite=0 wyłącza */
window.LITE=q.get('lite')==='1'||((window.EGRESS||window.PGM)&&q.get('lite')!=='0');
if(window.PGM)document.documentElement.classList.add('pgm');
if(window.LITE)document.documentElement.classList.add('lite')})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
<title>JEDEN overlay</title>
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
html,body{margin:0;padding:0;background:transparent !important;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#scene{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent}

/* ===== PASEK DOLNY ===== */
#barwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:var(--mb,43px);transition:transform .6s var(--ease),opacity .5s ease}
#barwrap.off{opacity:0;transform:translateY(calc(100% + var(--mb,43px) + 30px))}
#root{position:relative;width:1662px;height:214px;display:grid;grid-template-columns:155px 1507px;grid-template-rows:157px 57px}
#logo{background:#0b2e5b url(/assets/jeden_logo.png) center/cover no-repeat}
#clock{background:linear-gradient(180deg,#0b2e5b,#081d45 55%,#05133b);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#time{font-size:27px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.4);color:#fff;font-variant-numeric:tabular-nums}
#head{box-sizing:border-box;background:radial-gradient(1100px 190px at 100% 100%,rgba(236,44,44,.34),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.10)),linear-gradient(90deg,#8d1123,#a3162a 52%,#c21c28);border-radius:0 18px 0 0;padding:14px 40px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.45)}
#head::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#fff}
.line{color:#faf1f1;font-family:'Roboto Condensed',Arial,sans-serif;font-size:46px;font-weight:700;text-transform:uppercase;letter-spacing:0;line-height:1.15;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.35)}
#ticker{background:linear-gradient(180deg,#fff,#eef3f7);overflow:hidden;position:relative;display:flex;align-items:center}
#ticker::before,#ticker::after{content:"";position:absolute;left:0;right:0;height:0;background:none;z-index:2}
#ticker::before{top:0}#ticker::after{bottom:0}
#track{display:flex;align-items:center;white-space:nowrap;width:max-content;will-change:transform}
.lap{display:flex;align-items:center;white-space:nowrap}
.news{color:#0b1d4a;font-family:'Roboto Condensed',Arial,sans-serif;font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:0}
.bullet{display:inline-block;width:10px;height:29px;background:#a3162a;margin:0 28px;transform:skewX(-25deg);flex-shrink:0}
@keyframes sc{to{transform:translateX(-50%)}}

#barwrap.nohead #logo,#barwrap.nohead #head{display:none}
#barwrap:not(.off) #root{animation:barin .7s var(--ease)}
@keyframes barin{from{filter:brightness(1.6)}to{filter:none}}
#barwrap.nohead #root{grid-template-rows:57px;height:57px}

/* ===== PLAKIETKA NA ŻYWO (+ biała plakietka z tekstem po lewej) ===== */
#livewrap{position:absolute;top:var(--lt,43px);right:var(--lr,53px);height:64px;display:flex;transition:transform .6s var(--ease),opacity .5s ease}
#livewrap.off{opacity:0;transform:translateX(calc(100% + var(--lr,53px) + 30px))}
.livebadge{box-sizing:border-box;flex:none;height:100%;padding:0 30px;display:flex;align-items:center;justify-content:center;gap:12px;background:radial-gradient(160px 70px at 100% 100%,rgba(236,44,44,.38),transparent 75%),linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.10)),linear-gradient(100deg,#93142a,#ab1824 50%,#be1b23);border-radius:8px;font-family:Arial,Helvetica,sans-serif;box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative;overflow:hidden}
.ldot{width:14px;height:14px;border-radius:50%;background-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.7);flex-shrink:0;animation:ldp 1.2s ease-in-out infinite}
@keyframes ldp{50%{transform:scale(1.4);opacity:.55}}
.ltxt{color:#fff;font-size:26px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.4)}
#livelabel{display:none;box-sizing:border-box;height:100%;align-items:center;padding:0 24px;background:linear-gradient(180deg,#fbf9f9,#ebe7ea);border-radius:8px 0 0 8px;box-shadow:0 6px 14px rgba(0,0,0,.45);max-width:600px}
#livewrap.has #livelabel{display:flex}
#livewrap.has .livebadge{border-radius:0 8px 8px 0}
#lbltxt{display:block;color:#a3112a;font-family:'Roboto Condensed',Arial,sans-serif;font-weight:900;text-transform:uppercase;line-height:1.05;letter-spacing:.3px;text-align:left;text-wrap:balance}

/* ===== WYNIKI ANKIETY NA ŻYWO – wykres kołowy, lewy górny róg ===== */
#pollwrap{position:absolute;top:var(--pt,43px);left:53px;width:460px;transition:transform .6s var(--ease),opacity .5s ease,top .4s var(--ease)}
#pollwrap.off{opacity:0;transform:translateX(calc(-100% - 53px - 30px))}
#lpbox{transform-origin:0 0;background:linear-gradient(170deg,#13233f,#0a1426 70%);border-radius:0 22px 22px 22px;box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;color:#fff;font-family:'Roboto Condensed',Arial,sans-serif}
#lphead{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.10)),linear-gradient(90deg,#8d1123,#a3162a 55%,#c21c28);padding:12px 22px;display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.35);position:relative}
#lphead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff;opacity:.85}
.lpdot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8);animation:lpp 1.4s ease-in-out infinite}
#lphead.end .lpdot{animation:none}
@keyframes lpp{50%{transform:scale(1.35);opacity:.45}}
#lptitle{padding:16px 22px 0;font-size:26px;font-weight:700;line-height:1.2;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#lpchart{position:relative;width:250px;height:250px;margin:12px auto 6px}
#lppie{display:block;width:100%;height:100%;overflow:visible}
#lpslices circle{fill:none;stroke-width:100;transition:stroke-dasharray 1s var(--ease),stroke-dashoffset 1s var(--ease),stroke .4s}
#lplabels text{font-family:'Roboto Condensed',Arial,sans-serif;font-size:19px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:4px;letter-spacing:.3px;transition:opacity .5s}
#lpcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#lpcenter b{font-size:14px;letter-spacing:2px;color:#9fb2d4;text-transform:uppercase;font-weight:700}
#lpcenter span{font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05;text-align:center;max-width:130px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#lplegend{padding:6px 22px 4px}
.lpr{padding:7px 0}
.lpl{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:700}
.lpc{width:14px;height:14px;border-radius:4px;flex-shrink:0;box-shadow:0 0 8px currentColor}
.lpn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpp{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700}
.lpbar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.lpbar i{display:block;height:100%;width:0;border-radius:4px;transition:width 1s var(--ease)}
#lpfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 22px 14px;font-size:17px;color:#9fb2d4;border-top:1px solid rgba(255,255,255,.08);margin-top:8px;letter-spacing:.5px}

/* ===== QR (nad logiem JEDEN, lewa krawędź i szerokość równo z logiem) ===== */
#qrwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:calc(var(--mb,43px) + 14px);translate:0 calc(-1 * (var(--bh,214px) + var(--fh,0px)));transition:transform .6s var(--ease),opacity .5s ease,translate .6s var(--ease)}
#qrwrap.off{opacity:0;transform:translateX(calc(-100% - 129px - 60px))}
#fqrbox{box-sizing:border-box;width:155px;background:#fff;padding:8px;box-shadow:0 6px 14px rgba(0,0,0,.45);transition:opacity .45s ease,transform .6s var(--ease);transform-origin:50% 100%}
#fqrbox.hide{opacity:0;transform:translateY(18px) scale(.9);pointer-events:none}
#fqr{display:block;width:100%;height:auto}

/* ===== PLANSZA ROZMÓWCY (nad paskiem, od lewej; omija QR gdy ten jest widoczny) ===== */
#ltwrap{position:absolute;left:calc(129px + var(--ox,0px) + var(--lx,0px));bottom:calc(var(--mb,43px) + 14px);translate:0 calc(-1 * (var(--bh,214px) + var(--fh,0px)));max-width:940px;transition:transform .6s var(--ease),opacity .5s ease,left .4s var(--ease),translate .6s var(--ease)}
#ltwrap.off{opacity:0;transform:translateX(calc(-100% - 129px - var(--lx,0px) - 60px))}
#ltbox{display:flex;flex-direction:column;align-items:flex-start;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
#ltwrap:not(.off) #ltbox{animation:ltin .7s var(--ease)}
@keyframes ltin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#ltname{position:relative;box-sizing:border-box;max-width:100%;background:linear-gradient(90deg,#9e0c05,#d60f08 60%,#ea3f26);color:#fff;font-size:46px;font-weight:800;text-transform:uppercase;letter-spacing:-.3px;line-height:1.15;padding:12px 44px 12px 30px;border-radius:0 20px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px rgba(0,0,0,.4);border-bottom:5px solid #5e0000;font-family:'Roboto Condensed',Arial,sans-serif}
#ltname::after{content:"";position:absolute;top:0;bottom:0;width:70px;left:-90px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:ltshine 3.5s ease-in-out infinite}
@keyframes ltshine{0%{left:-90px}50%,100%{left:110%}}
#ltrole{box-sizing:border-box;max-width:100%;background:linear-gradient(90deg,#0e2347,#16305c);color:#e8eef9;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;line-height:1.2;padding:9px 40px 9px 30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:6px solid #d60f08;font-family:'Roboto Condensed',Arial,sans-serif}

/* ===== PILNE (pasek newsa przyklejony do góry dolnego paska) ===== */
#flashwrap{position:absolute;left:calc(129px + var(--ox,0px));bottom:var(--mb,43px);translate:0 calc(-1 * var(--bh,214px));width:max-content;max-width:1662px;transition:transform .6s var(--ease),opacity .45s ease,translate .6s var(--ease)}
#flashwrap.off{opacity:0;transform:translateY(60px)}
#flbox{display:grid;grid-template-columns:155px minmax(0,auto);height:62px;border-radius:0 18px 0 0;box-shadow:0 -4px 12px rgba(0,0,0,.4)}
#flashwrap:not(.off) #flbox{animation:flin .6s var(--ease)}
@keyframes flin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#fllabel{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#d7192a,#a3162a);color:#fff;font:900 36px/1 'Roboto Condensed',Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.35);position:relative;overflow:hidden;white-space:nowrap}
#fllabel::after{content:"";position:absolute;top:0;bottom:0;width:50px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:ltshine 3s ease-in-out infinite}
#fltxtwrap{min-width:0;display:flex;align-items:center;overflow:hidden;background:#fff;border-radius:0 18px 0 0;padding:0 40px}
#flbox.nolabel{grid-template-columns:minmax(0,auto)}
#fltxt{display:inline-block;white-space:nowrap;color:#b3141f;font:800 38px/1 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:.3px}
#fltxt.mq{animation:flmq var(--dur,10s) linear 1.2s infinite alternate;will-change:transform}
@keyframes flmq{from{transform:translateX(0)}to{transform:translateX(var(--dist,0px))}}

/* ===== ZBIÓRKA (nad paskiem, prawa krawędź równo z paskiem) ===== */
#fundwrap{position:absolute;right:calc(129px - var(--ox,0px));bottom:calc(var(--mb,43px) + 14px);translate:0 calc(-1 * (var(--fbh,var(--bh,214px)) + var(--ffh,0px)));display:flex;align-items:flex-end;transition:transform .6s var(--ease),opacity .5s ease,translate .6s var(--ease)}
#fundwrap.off{opacity:0;transform:translateX(calc(100% + 500px))}
#fundwrap:not(.off) #fcard{animation:fin .7s var(--ease)}
@keyframes fin{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
#fcard{position:relative;width:416px;font-family:'Oswald','Bahnschrift','Roboto Condensed','Arial Narrow',Impact,Arial,sans-serif;text-transform:uppercase;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
#ftruck{display:block;width:100%;height:auto;margin-bottom:-6px}
#fdish{transform-origin:420px 62px}
#frow{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:6px;white-space:nowrap;line-height:1}
#fl1{font-size:24px;font-weight:700;color:#f4f4f4;letter-spacing:.5px;text-shadow:0 0 3px #000,0 2px 4px rgba(0,0,0,.9)}
#fam{font-size:51px;font-weight:700;color:#2bb8e6;letter-spacing:.5px;text-shadow:0 0 3px #000,0 2px 5px rgba(0,0,0,.9)}
#fam small{font-size:32px;text-transform:none;margin-left:4px}
#fl2{font-size:40px;font-weight:700;color:#f4f4f4;line-height:1.05;text-align:center;white-space:nowrap;margin-top:2px;letter-spacing:.5px;text-shadow:0 0 3px #000,0 2px 5px rgba(0,0,0,.9)}
#fstrip{position:relative;margin-top:6px}
#fstrip.bump{animation:fbump .8s var(--ease)}
@keyframes fbump{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
#fstrip.bump #ffill{box-shadow:0 0 22px #6be04a}
#ftrack{position:relative;height:45px;box-sizing:border-box;background:linear-gradient(180deg,#4d6a7e,#2f4a5c);border:3px solid #e6ebf0;outline:1px solid #1d2b36;overflow:hidden}
#ffill{position:relative;height:100%;width:0;background:linear-gradient(180deg,#52b83a 0,#3f9b2a 45%,#2a741b);transition:width .8s var(--ease);overflow:hidden}
#ffill::after{content:"";position:absolute;top:0;bottom:0;width:40px;left:-60px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:fshine 4s ease-in-out infinite}
@keyframes fshine{0%{left:-60px}55%,100%{left:120%}}
#fpct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 1px 3px rgba(0,0,0,.9)}

/* ===== OZNACZENIE WIEKU ===== */
#agewrap{position:absolute;top:43px;left:53px;height:72px;transition:transform .6s var(--ease),opacity .5s ease}
#agewrap.off{opacity:0;transform:translateX(calc(-100% - 53px - 30px))}
#ageimg{display:block;height:100%;width:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}

/* ===== REKLAMY ===== */
#adwrap{position:absolute;inset:0;background:#000;opacity:0;visibility:hidden;z-index:50;transition:opacity .5s,visibility 0s .5s}
#adwrap.on{opacity:1;visibility:visible;transition:opacity .5s}
#adv{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#adlabel{position:absolute;top:43px;left:53px;background:#d60f08;color:#fff;font:800 24px Arial,sans-serif;letter-spacing:1px;padding:8px 18px;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.45)}

/* ===== PRZERWA / ZARAZ WRACAMY ===== */
#brk{position:absolute;inset:0;z-index:40;overflow:hidden;opacity:0;visibility:hidden;background:#050d1c;font-family:'Oswald','Arial Narrow',Impact,Arial,sans-serif;text-transform:uppercase;transition:opacity .7s,visibility 0s .7s}
#brk.on{opacity:1;visibility:visible;transition:opacity .7s}
.bk-bg{position:absolute;inset:0;background:radial-gradient(1100px 700px at 15% 10%,#16305c,transparent 60%),radial-gradient(900px 700px at 90% 95%,#8a0a0a,transparent 55%),linear-gradient(160deg,#08142a,#050d1c 60%,#12060a)}
.bk-st{position:absolute;inset:-200px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 54px);animation:bkst 12s linear infinite}
@keyframes bkst{to{transform:translateX(59.6px)}}
.bk-sw{position:absolute;top:0;bottom:0;width:380px;left:-500px;background:linear-gradient(100deg,transparent,rgba(255,80,60,.22),transparent);transform:skewX(-20deg);animation:bksw 7s ease-in-out infinite}
@keyframes bksw{0%{left:-500px}60%,100%{left:2000px}}
#bkp i{position:absolute;bottom:-20px;border-radius:50%;background:#fff;animation:bkr linear infinite}
@keyframes bkr{to{transform:translateY(-1150px);opacity:0}}
#bkl{position:absolute;left:150px;top:50%;transform:translateY(-50%);width:900px}
#bklogo{width:130px;height:130px;background:#0a1a2e url(/assets/jeden_logo.png) center/cover no-repeat;border-bottom:6px solid #d60f08;box-shadow:0 10px 30px rgba(0,0,0,.5);margin-bottom:46px}
#bkt{font-size:190px;font-weight:700;line-height:.95;letter-spacing:2px;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6);transform:translateY(50px);opacity:0;transition:transform 1s var(--ease) .3s,opacity 1s .3s}
#bkline{height:10px;width:0;background:linear-gradient(90deg,#d60f08,#ff6b3d);margin:26px 0;transition:width 1.2s var(--ease) .6s;box-shadow:0 0 24px rgba(255,59,59,.7)}
#bks{font-size:46px;font-weight:600;opacity:0;color:#cfd8e6;letter-spacing:1px;transition:opacity 1s .9s}
#bkat{display:inline-block;margin-top:34px;padding:10px 28px;background:#d60f08;border-radius:0 14px 0 0;font-size:34px;font-weight:700;letter-spacing:1px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
#brk.on #bkt{transform:none;opacity:1}#brk.on #bkline{width:420px}#brk.on #bks{opacity:1}
#bkr{position:absolute;right:130px;top:50%;width:600px;height:600px;transform:translateY(-50%)}
#bkr svg{position:absolute;inset:0;width:100%;height:100%}
#bkd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#bkdig{font-size:170px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 6px 24px rgba(0,0,0,.6)}
#bklab{font-size:30px;letter-spacing:4px;color:#9fb3d1;margin-top:10px}
#bkf{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:28px;letter-spacing:6px;color:#8ea2c4}
#brk.zero #bkdig{animation:bkp 1s ease-in-out infinite}@keyframes bkp{50%{transform:scale(1.06)}}
#bkarc{transition:stroke-dashoffset .4s linear;filter:drop-shadow(0 0 18px rgba(255,59,59,.8))}
#bktk{transform-origin:300px 300px;animation:bkspin 80s linear infinite}@keyframes bkspin{to{transform:rotate(360deg)}}

/* ===== SONDAŻ NA PEŁNYM EKRANIE ===== */
#pstage{position:absolute;inset:0;pointer-events:none}
#wipe{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,#dc0432 40%,#ff3b3b 60%,transparent);transform:skewX(-20deg);opacity:0}
#pstage.on #wipe{animation:wipe 1.1s var(--ease) forwards}
@keyframes wipe{0%{left:-40%;opacity:.95}100%{left:120%;opacity:0}}
#pcard{position:absolute;left:50%;top:50%;width:1420px;transform:translate(-50%,-46%) scale(.94);opacity:0;clip-path:inset(0 100% 0 0 round 22px);
 background:radial-gradient(900px 420px at 0% 0%,rgba(214,15,8,.28),transparent 70%),radial-gradient(700px 380px at 100% 100%,rgba(59,130,246,.22),transparent 70%),linear-gradient(160deg,#0f1f3b,#070f20 75%);

/* ===== PGM: obraz z gry pod overlayem, całość skalowana do okna ===== */
html.pgm,html.pgm body{background:#000 !important;width:100%;height:100%;cursor:none}
html.pgm #scene{position:absolute;left:50%;top:50%;margin:-540px 0 0 -960px;transform:scale(var(--sc,1));transform-origin:50% 50%;background:#000}
#pgmv{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
html.pgm #pgmv{display:block}
/* kolejność warstw: wideo zawsze pod wszystkim; filtr wyłącza sprzętową nakładkę wideo (przez nią znikały elementy) */
#scene{isolation:isolate}
#pgmv{z-index:0;filter:brightness(1.001)}
/* ZATRZYMAJ / WZNÓW: czarna zasłona nad obrazem z gry (pod overlayem) – płynne przenikanie, nie cięcie */
#pgmcover{display:none;position:absolute;inset:0;background:#000;opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:0}
html.pgm #pgmcover{display:block}
#pgmcover.on{opacity:1}
:where(#scene>*:not(#pgmv)){z-index:1}
#pgmwait{z-index:0}
#pgmfreeze{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:0;pointer-events:none}
html.pgm #pgmfreeze.on{display:block}
#pgmlast{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:0;pointer-events:none}
html.pgm #pgmlast.on{display:block}
#barwrap,#livewrap,#fundwrap,#qrwrap,#ltwrap,#flashwrap,#agewrap,#pollwrap{will-change:transform,opacity,translate}
#pgmwait{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#9fb3d1;font:700 40px/1.2 'Roboto Condensed',Arial,sans-serif;text-transform:uppercase;letter-spacing:2px}
#pgmwait small{font-size:24px;font-weight:700;color:#6f84a8;letter-spacing:1px}
html.pgm #pgmwait.on{display:flex}
#snd{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99;background:#d60f08;color:#fff;font:700 15px Arial,sans-serif;padding:9px 18px;border:0;border-radius:8px;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.5)}

html.lite .bk-st,html.lite .bk-sw,html.lite #bkp i,html.lite #bktk{animation:none !important}

      if (!on) { clearTimeout(flT); flForceOff = false; }
      flPrev = on; setVis('flashwrap', on && !flForceOff); setFlH(on && !flForceOff);
    } else { flPrev = false; setVis('flashwrap', false); setFlH(false); }
  } catch (e) { console.error('pilne', e); }

  try {
    const c = s.poll_cmd;
    if (c && c.seq !== lastSeq) {
      const fresh = Date.parse(s.serverNow) - Date.parse(c.at) <= 30000;
      setSeq(c.seq);
      if (c.action === 'show' && fresh) showPoll(s.poll);
      else if (c.action === 'hide') hidePoll();
    }
  } catch (e) { console.error('sondaż', e); }

  try {
    const a = s.ads, c = s.ads_cmd; adCfg = a;
    if ($('adv').volume !== undefined && $('adwrap').classList.contains('on')) $('adv').volume = Math.max(0, Math.min(1, (+a.volume || 0) / 100));
    $('adlabel').style.display = a.label ? '' : 'none';
    if (c && c.seq !== lastAdSeq) {
      const fresh = Date.parse(s.serverNow) - Date.parse(c.at) <= 30000;
      lastAdSeq = c.seq; try { localStorage.setItem('overlay_ads_seq', String(c.seq)); } catch (e) {}
      if (c.action === 'stop' || fresh) runAdCmd(c);
    }
    if (+a.everyMinutes > 0) {
      const slot = Math.floor((Date.parse(s.serverNow) - Date.parse(a.startedAt)) / (a.everyMinutes * 60000));
      if (lastSlot !== null && slot > lastSlot && slot > 0) autoAd(slot);
      lastSlot = slot;
    } else lastSlot = null;
  } catch (e) { console.error('reklamy', e); }

  try { fitPoll(); } catch (e) { console.error('dopasowanie ankiety', e); }
}
async function poll(){
  if (DEMO) { if (!brk) renderBreak({visible: true, kind: DEMO === 'brb' ? 'brb' : 'break', endsAt: new Date(Date.now() + 300000).toISOString(), footer: 'jeden.tv'}); return; }
  if (!KEY) { clearAll(); return; }
  try {
    const r = await fetch('/api/state?key=' + encodeURIComponent(KEY), {cache: 'no-store'});
    if (!r.ok) { clearAll(); return; }
    apply(await r.json());
  } catch (e) { /* chwilowy brak sieci – zostawiamy stan jak jest */ }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { barSig = ''; fundSig = ''; lblSig = ''; flSig = ''; try { updFundLift(); } catch (e) {} });
poll(); setInterval(poll, 2000);

/* po nowym wdrożeniu na Vercelu overlay sam się przeładowuje (OBS i podgląd w panelu nie zostają na starej wersji) */
(function(){
  let ver = null;
  async function chk(){
    try {
      const r = await fetch(location.pathname + '?v=' + Date.now(), {method: 'HEAD', cache: 'no-store'});
      const v = r.headers.get('etag') || r.headers.get('last-modified'); if (!v) return;
      if (ver === null) { ver = v; return; }
      if (v === ver) return;
      let last = 0; try { last = +sessionStorage.getItem('overlay_reload') || 0; } catch (e) {}
      if (Date.now() - last < 300000 || $('adwrap').classList.contains('on')) return; /* bez pętli i nie w trakcie reklamy */
      try { sessionStorage.setItem('overlay_reload', String(Date.now())); } catch (e) {}
      location.reload();
    } catch (e) {}
  }
  setTimeout(chk, 5000); setInterval(chk, 60000);
})();

/* ---------- wykres kołowy: wyniki ankiety na żywo (odświeżanie co 12 s) ---------- */
const LP_COL = ['#ff4d5a', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#06b6d4', '#ec4899', '#94a3b8'];
const LP_C = 2 * Math.PI * 50;
const lpEsc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const SVGNS = 'http://www.w3.org/2000/svg';
function lpRender(d){
  let rows = d.rows.slice().sort((a, b) => b.n - a.n);
  if (rows.length > 8) rows = rows.slice(0, 7).concat({name: 'Pozostałe', n: rows.slice(7).reduce((s, x) => s + x.n, 0)});
  const tot = rows.reduce((s, x) => s + x.n, 0), g = $('lpslices'), lab = $('lplabels');
  const slices = tot ? rows : [{name: '', n: 1}];
  while (g.children.length < slices.length) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', 100); c.setAttribute('cy', 100); c.setAttribute('r', 50);
    c.style.strokeDasharray = '0 ' + LP_C; c.style.strokeDashoffset = '0';
    g.appendChild(c);
  }
  while (g.children.length > slices.length) g.removeChild(g.lastChild);
  while (lab.children.length < slices.length) lab.appendChild(document.createElementNS(SVGNS, 'text'));
  while (lab.children.length > slices.length) lab.removeChild(lab.lastChild);
  let cum = 0;
  slices.forEach((x, i) => {
    const frac = x.n / (tot || 1), c = g.children[i], t = lab.children[i];
    const col = LP_COL[i % 8];
    c.style.stroke = tot ? col : '#2a3b5c';
    c.style.strokeDasharray = Math.max(0, frac * LP_C - (slices.length > 1 ? 1.5 : 0)) + ' ' + LP_C;
    c.style.strokeDashoffset = -cum * LP_C;
    const mid = (cum + frac / 2) * 2 * Math.PI, pct = Math.round(frac * 100);
    t.setAttribute('x', (100 + 72 * Math.cos(mid)).toFixed(2));
    t.setAttribute('y', (100 + 72 * Math.sin(mid)).toFixed(2));
    t.textContent = tot && frac >= 0.06 ? pct + '%' : '';
    cum += frac;
  });
  $('lptitle').textContent = d.title;
  $('lpstat').textContent = d.status === 'closed' ? 'Wyniki końcowe' : 'Wyniki na żywo';
  $('lphead').classList.toggle('end', d.status === 'closed');
  $('lplegend').innerHTML = rows.map((x, i) => {
    const pc = tot ? Math.round(x.n / tot * 100) : 0, col = LP_COL[i % 8];
    return '<div class="lpr"><div class="lpl" style="color:' + col + '"><div class="lpc" style="background:' + col + '"></div>' +
      '<div class="lpn" style="color:#fff">' + lpEsc(x.name) + '</div><div class="lpp" style="color:#fff">' + pc + '%</div></div>' +
      '<div class="lpbar"><i style="background:' + col + ';width:' + pc + '%"></i></div></div>';
  }).join('');
  $('lptot').textContent = 'Oddano głosów: ' + tot;
  $('lpurl').textContent = 'Głosuj: ' + location.host + '/glosuj';
  fitPoll();
}
async function livePoll(){
  if (DEMO || !KEY) return;
  try {
    const r = await fetch('/api/ankieta?a=live&key=' + encodeURIComponent(KEY), {cache: 'no-store'});
    if (!r.ok) { setVis('pollwrap', false); return; }
    const d = await r.json();
    if (d.show) { lpRender(d); setVis('pollwrap', true); } else setVis('pollwrap', false);
  } catch (e) { /* chwilowy brak sieci – zostawiamy jak jest */ }
}
livePoll(); setInterval(livePoll, 12000);
/* ---------- PGM: obraz i dźwięk z gry (LiveKit) pod overlayem ---------- */
const MUTE = QS.get('mute') === '1';
const pgmv = $('pgmv'), snd = $('snd'), pgmwait = $('pgmwait');
let pgmRoom = null, pgmTry = 0, recSent = false, lkLib = null;
if (QS.get('fit') === 'cover') pgmv.style.objectFit = 'cover';
/* tryb egress (wysyłka z chmury na Twitcha/TikToka): sygnał startu nagrywania dla LiveKit */
function startRec(){ if (!EGRESS || recSent) return; recSent = true; console.log('START_RECORDING'); }
if (EGRESS) setTimeout(startRec, 20000);
pgmv.addEventListener('playing', () => { setTimeout(startRec, 1500); pgmStuck = 0; pgmMsg(''); });
function pgmMsg(t, sub){
  if (!t) { pgmwait.classList.remove('on'); return; }
  if (EGRESS) return;
  pgmwait.firstElementChild.textContent = t; pgmwait.lastElementChild.textContent = sub || ''; pgmwait.classList.add('on');
}
function sndHint(){ snd.style.display = (pgmRoom && !pgmRoom.canPlaybackAudio && !MUTE && !EGRESS) ? 'block' : 'none'; }
const LK_URLS = ['https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js', 'https://unpkg.com/livekit-client@2.5.7/dist/livekit-client.umd.min.js'];
function loadScriptT(src, ms){
  return new Promise((ok, er) => {
    const sc = document.createElement('script'), t = setTimeout(() => { sc.remove(); er(new Error('timeout')); }, ms);
    sc.src = src; sc.onload = () => { clearTimeout(t); ok(); }; sc.onerror = () => { clearTimeout(t); sc.remove(); er(new Error('blocked')); };
    document.head.appendChild(sc);
  });
}
function loadLk(){
  return lkLib || (lkLib = (async () => {
    if (window.LivekitClient) return;
    for (const u of LK_URLS) { try { await loadScriptT(u, 10000); if (window.LivekitClient) return; } catch (e) { /* następny adres */ } }
    lkLib = null; throw new Error('Nie udało się załadować modułu obrazu (sprawdź internet / blokadę skryptów w przeglądarce)');
  })());
}
/* stan obrazu: kto publikuje, czy obraz faktycznie dochodzi; przy zawieszeniu – ponowne połączenie */
let pgmStuck = 0;
function pgmHasVideo(){ const t = pgmv.srcObject && pgmv.srcObject.getVideoTracks ? pgmv.srcObject.getVideoTracks() : []; return t.length > 0 && t[0].readyState === 'live'; }
function pgmCheck(){
  if (!pgmRoom) return;
  if (pgmHasVideo() && pgmv.readyState >= 2) { pgmStuck = 0; pgmMsg(''); return; }
  const pub = [...pgmRoom.remoteParticipants.values()].find(p => p.identity === 'gra');
  if (!pub) { pgmStuck = 0; pgmMsg('Czekam na obraz z gry…', 'W panelu wybierz okno gry (monitor PVW)'); return; }
  const vp = [...pub.trackPublications.values()].find(x => x.kind === 'video');
  if (!vp) { pgmStuck = 0; pgmMsg('Czekam na obraz z gry…', 'Operator jest połączony, ale nie opublikował okna gry'); return; }
  pgmMsg('Obraz z gry nie dociera…', 'Ponawiam połączenie');
  if (++pgmStuck >= 4) { pgmStuck = 0; try { pgmRoom.disconnect(); } catch (e) {} }   // Disconnected → automatyczne ponowne łączenie
}
setInterval(pgmCheck, 2500);
async function pgmConnect(){
  if (!window.PGM || DEMO || !KEY || pgmRoom) return;
  let retry = Math.min(15000, 2000 * (++pgmTry));
  try {
    pgmMsg('Łączę z obrazem z gry…', 'Pobieram dostęp');
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 10000);
    let r; try { r = await fetch('/api/lk?key=' + encodeURIComponent(KEY), {cache: 'no-store', signal: ac.signal}); } finally { clearTimeout(to); }
    if (r.status === 503) { pgmMsg('Brak LiveKit na serwerze', 'Ustaw LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET w Vercelu'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); pgmMsg('Łączę z obrazem z gry…', 'Ładuję moduł obrazu'); await loadLk();
    pgmMsg('Łączę z obrazem z gry…', 'Łączę z serwerem obrazu');
    const L = window.LivekitClient, room = new L.Room({adaptiveStream: false, dynacast: false});
    room.on(L.RoomEvent.TrackSubscribed, track => {
      /* wysyłka z chmury: bufor odbioru ~400 ms (ten sam dla obrazu i dźwięku → synchronizacja) – gładszy 60 kl/s bez gubienia klatek; opóźnienie nie ma tu znaczenia */
      if (EGRESS) { try { if (track.receiver && 'jitterBufferTarget' in track.receiver) track.receiver.jitterBufferTarget = 400; } catch (e) {} }
      if (track.kind === 'video') { track.attach(pgmv); const p = pgmv.play(); if (p && p.catch) p.catch(() => {}); }
      else if (track.kind === 'audio') { const a = track.attach(); a.muted = MUTE; a.volume = 1; a.style.display = 'none'; document.body.appendChild(a); const p = a.play(); if (p && p.catch) p.catch(() => sndHint()); }
      sndHint(); pgmCheck();
    });
    room.on(L.RoomEvent.TrackUnsubscribed, track => {
      if (track.kind === 'video') { track.detach(pgmv); pgmv.srcObject = null; }
      else track.detach().forEach(el => el.remove());
      pgmCheck();
    });
    [L.RoomEvent.ParticipantConnected, L.RoomEvent.ParticipantDisconnected, L.RoomEvent.TrackPublished, L.RoomEvent.TrackUnpublished].forEach(ev => room.on(ev, () => setTimeout(pgmCheck, 300)));
    room.on(L.RoomEvent.AudioPlaybackStatusChanged, sndHint);
    room.on(L.RoomEvent.DataReceived, payload => { try { const m = JSON.parse(new TextDecoder().decode(payload)); if (m && m.t === 'pause') setPause(!!m.on, true); } catch (e) {} });
    room.on(L.RoomEvent.Disconnected, () => { if (pgmRoom === room) { pgmRoom = null; pgmv.srcObject = null; sndHint(); pgmMsg('Czekam na obraz z gry…', 'Łączę ponownie…'); setTimeout(pgmConnect, 3000); } });
    await Promise.race([room.connect(j.url, j.token), new Promise((_, no) => setTimeout(() => no(new Error('Przekroczono czas łączenia z serwerem obrazu (sprawdź blokadę WebRTC/VPN)')), 15000))]);
    pgmRoom = room; pgmTry = 0; sndHint(); try { room.startAudio().then(sndHint).catch(() => {}); } catch (e) {}
    pgmCheck();
  } catch (e) {
    console.error('pgm', e); pgmRoom = null;
    pgmMsg('Nie mogę połączyć z obrazem z gry', String((e && e.message) || e).slice(0, 120) + ' · ponawiam…');
    setTimeout(pgmConnect, retry);
  }
}
function unlockAudio(){ if (pgmRoom) pgmRoom.startAudio().then(sndHint).catch(() => {}); }
snd.onclick = unlockAudio; ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio));
pgmConnect();

/* ===== OSTATNIA DOBRA KLATKA: gdy przechwytywanie padnie (okno gry zminimalizowane / zamknięte → czerń albo koniec ścieżki), pokazujemy ostatni dobry obraz ===== */
(function(){
  if (!window.PGM) return;
  const probe = document.createElement('canvas'); probe.width = 32; probe.height = 18;
  const pctx = probe.getContext('2d', {willReadFrequently: true});
  let bad = 0, tick = 0, hasGood = false;
  function isBlack(v){
    try {
      pctx.drawImage(v, 0, 0, 32, 18);
      const d = pctx.getImageData(0, 0, 32, 18).data; let sum = 0, mx = 0;
      for (let i = 0; i < d.length; i += 4) { const m = Math.max(d[i], d[i+1], d[i+2]); sum += m; if (m > mx) mx = m; }
      return (sum / 576) < 1.5 && mx < 8;      // niemal idealna czerń = awaria przechwytywania, nie scena z gry
    } catch (e) { return false; }
  }
  setInterval(function(){
    const v = $('pgmv'), last = $('pgmlast'); if (!v || !last) return;
    const tr = v.srcObject && v.srcObject.getVideoTracks ? v.srcObject.getVideoTracks()[0] : null;
    const gone = !v.videoWidth || (tr && tr.readyState === 'ended');
    const black = !gone && isBlack(v);
    if (pausedNow) { bad = 0; return; }       // pauza ma własną zamrożoną klatkę
    if (gone || black) bad++; else bad = 0;
    if (!gone && !black) {                    // dobry obraz – zapamiętaj co sekundę
      if ((tick++ % 2) === 0) { try { last.width = v.videoWidth; last.height = v.videoHeight; last.getContext('2d').drawImage(v, 0, 0); hasGood = true; } catch (e) {} }
      last.classList.remove('on');
    } else if (bad >= 3 && hasGood) last.classList.add('on');
  }, 500);
})();
